name: Sync sheet

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download sheet and write JSON
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: node scripts/sync-sheet.js
      - name: Commit if the catalog changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/products.json
          if git diff --staged --quiet; then
            echo "No catalog change"
          else
            git commit -m "Update catalog from Google Sheet"
            git push
          fi
