<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volume Discounts</title>
  <style>
    :root {
      --bg: #07090e;
      --panel: #12171f;
      --line: #2a3344;
      --text: #f4f7fb;
      --muted: #8b97ab;
      --blue: #2f7bff;
      --blue-soft: #17315f;
      --save: #f5b942;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px 16px;
    }
    .wrap { width: min(420px, 100%); margin: 0 auto; }
    h2 { font-size: 18px; margin-bottom: 12px; }
    .tiers { display: grid; gap: 8px; }
    .tier {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      cursor: pointer;
    }
    .tier.active {
      border-color: var(--blue);
      background: var(--blue-soft);
    }
    .save { color: var(--save, #f5b942); font-weight: 600; }
    .qty-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
    }
    .stepper { display: flex; align-items: center; gap: 10px; }
    .stepper button {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #1a2130;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
    .stepper span {
      min-width: 28px;
      text-align: center;
      font-weight: 700;
    }
    .muted { color: var(--muted); }
    .total {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      font-weight: 700;
    }
    .btn {
      margin-top: 16px;
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap" data-base="107.99">
    <h2>Volume Discounts</h2>
    <div class="tiers" id="tiers"></div>
    <div class="qty-row">
      <span class="muted">Quantity:</span>
      <div class="stepper">
        <button type="button" id="minus">−</button>
        <span id="qty">1</span>
        <button type="button" id="plus">+</button>
      </div>
    </div>
    <div class="total">
      <span>Line total</span>
      <span id="lineTotal">$107.99</span>
    </div>
    <button class="btn" type="button" id="addBtn">Add to cart</button>
  </div>

  <script>
    function money(n) {
      return (Math.round((Number(n) + Number.EPSILON) * 100) / 100);
    }

    function fmt(n) {
      return '$' + money(n).toFixed(2);
    }

    function getVolumePrice(basePrice, qty) {
      const base = money(basePrice);
      const q = Math.max(1, parseInt(qty, 10) || 1);
      let percentOff = 0;
      let tier = '1-4';
      if (q >= 10) { percentOff = 20; tier = '10+'; }
      else if (q >= 5) { percentOff = 10; tier = '5-9'; }
      const savings = money(base * (percentOff / 100));
      const unitPrice = money(base - savings);
      return { unitPrice, savings, percentOff, tier, base };
    }

    function tierForQty(qty) {
      if (qty >= 10) return '10+';
      if (qty >= 5) return '5-9';
      return '1-4';
    }

    const root = document.querySelector('[data-base]');
    const base = money(root.dataset.base);
    let qty = 1;

    const rows = [
      { key: '1-4', label: 'Qty: 1 - 4', min: 1 },
      { key: '5-9', label: 'Qty: 5 - 9', min: 5 },
      { key: '10+', label: 'Qty: 10+', min: 10 }
    ];

    function rowPrice(key) {
      const sampleQty = key === '10+' ? 10 : key === '5-9' ? 5 : 1;
      return getVolumePrice(base, sampleQty);
    }

    function render() {
      const current = getVolumePrice(base, qty);
      document.getElementById('qty').textContent = qty;
      document.getElementById('lineTotal').textContent = fmt(current.unitPrice * qty);
      document.getElementById('tiers').innerHTML = rows.map(r => {
        const p = rowPrice(r.key);
        const save = p.percentOff ? ` <span class="save">(save ${fmt(p.savings)})</span>` : '';
        return `<div class="tier${current.tier === r.key ? ' active' : ''}" data-min="${r.min}">
          <span>${r.label}</span>
          <span>${fmt(p.unitPrice)} each${save}</span>
        </div>`;
      }).join('');
      document.querySelectorAll('.tier').forEach(el => {
        el.onclick = () => {
          qty = Number(el.dataset.min);
          render();
        };
      });
    }

    document.getElementById('minus').onclick = () => {
      qty = Math.max(1, qty - 1);
      render();
    };
    document.getElementById('plus').onclick = () => {
      qty += 1;
      render();
    };
    document.getElementById('addBtn').onclick = () => {
      const p = getVolumePrice(base, qty);
      alert('Add to cart: qty ' + qty + ' at ' + fmt(p.unitPrice) + ' each (line ' + fmt(p.unitPrice * qty) + ')');
    };

    render();

    // Self-check against the required examples
    const checks = [
      [32.99, 1, 32.99, 0],
      [32.99, 5, 29.69, 3.30],
      [32.99, 10, 26.39, 6.60],
      [107.99, 1, 107.99, 0],
      [107.99, 5, 97.19, 10.80],
      [107.99, 10, 86.39, 21.60],
      [215.99, 1, 215.99, 0],
      [215.99, 5, 194.39, 21.60],
      [215.99, 10, 172.79, 43.20]
    ];
    checks.forEach(([b, q, unit, save]) => {
      const r = getVolumePrice(b, q);
      if (r.unitPrice !== unit || r.savings !== save) {
        console.error('Mismatch', b, q, r);
      }
    });
  </script>
</body>
</html>
